<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, 'requerimientos', ~{::section})}">
<head><title>Requerimiento · DRACOR</title></head>
<body>
<section>
    <h1 class="page-title" th:text="${requerimiento.id == null} ? 'Nuevo requerimiento' : 'Editar requerimiento'">Requerimiento</h1>
    <p class="page-sub">Los campos con * son obligatorios.</p>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <form class="card" th:action="@{/requerimientos/guardar}" method="post">
        <div class="card-body row g-3">
            <input type="hidden" name="id" th:value="${requerimiento.id}">
            <div class="col-md-6"><label class="form-label req">Cliente / entidad</label>
                <select class="form-select" name="cliente.id" required>
                    <option value="">Seleccione…</option>
                    <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.razonSocial}"
                            th:selected="${requerimiento.cliente != null and requerimiento.cliente.id == c.id}">c</option>
                </select></div>
            <div class="col-md-6"><label class="form-label req">Origen</label>
                <select class="form-select" name="origen" required>
                    <option value="">Seleccione…</option>
                    <option th:each="o : ${origenes}" th:value="${o}" th:text="${o.etiqueta}" th:selected="${o == requerimiento.origen}">o</option>
                </select></div>
            <div class="col-md-6"><label class="form-label req">Fecha de recepción</label><input class="form-control" type="date" name="fechaRecepcion" th:value="${requerimiento.fechaRecepcion}" required></div>
            <div class="col-md-6"><label class="form-label">Fecha límite de respuesta</label><input class="form-control" type="date" name="fechaLimite" th:value="${requerimiento.fechaLimite}"></div>
            <div class="col-12"><label class="form-label req">Descripción</label><textarea class="form-control" name="descripcion" rows="4" required th:text="${requerimiento.descripcion}"></textarea></div>
        </div>
        <div class="card-footer bg-white d-flex gap-2">
            <button class="btn btn-dracor" type="submit"><i class="bi bi-save"></i> Guardar</button>
            <a class="btn btn-outline-secondary" th:href="@{/requerimientos}">Cancelar</a>
        </div>
    </form>
</section>
</body>
</html>
