spring.application.name=SGSAO-DRACOR
server.port=8080
server.servlet.session.timeout=30m
server.error.whitelabel.enabled=false

# ---------- Base de datos (XAMPP / MySQL en localhost:3306, administrable con HeidiSQL) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/dracor_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

# Hibernate crea y actualiza las tablas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# ---------- Archivos adjuntos ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
dracor.uploads.dir=uploads

# ---------- Reglas del sistema ----------
# Dias previos al vencimiento para marcar una actividad como "por vencer" (RN-13)
dracor.alertas.dias-previos=3
# Intentos fallidos de ingreso antes del bloqueo temporal (RNF-05)
dracor.seguridad.max-intentos=5
dracor.seguridad.minutos-bloqueo=10
# Carga datos de ejemplo la primera vez que se inicia el sistema
dracor.datos-demo=true

# ---------- Interfaz ----------
spring.thymeleaf.cache=false
spring.web.locale=es_PE
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso
spring.messages.encoding=UTF-8
