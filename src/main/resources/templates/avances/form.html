<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{fragments/layout :: layout(~{::title}, 'obras', ~{::section})}">
<head><title>Registrar avance · DRACOR</title></head>
<body>
<section>
    <h1 class="page-title">Registrar avance</h1>
    <p class="page-sub"><strong th:text="${actividad.obra.codigo}">OB</strong> · <span th:text="${actividad.nombre}">actividad</span> · avance actual <strong th:text="${actividad.avance} + '%'">0%</strong></p>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="row g-3">
        <div class="col-lg-5">
            <form class="card" th:action="@{/avances/actividad/{id}(id=${actividad.id})}" method="post">
                <div class="card-body row g-3">
                    <div class="col-12"><label class="form-label req">Nuevo porcentaje de avance (0–100)</label>
                        <input class="form-control" type="number" min="0" max="100" step="1" name="porcentaje" th:value="${actividad.avance}" required></div>
                    <div class="col-12"><label class="form-label">Fecha del avance</label><input class="form-control" type="date" name="fecha" th:value="${hoy}"></div>
                    <div class="col-12"><label class="form-label">Observación</label><textarea class="form-control" name="observacion" rows="3"></textarea></div>
                    <div class="col-12"><label class="form-label">Motivo del retroceso</label><input class="form-control" name="motivoRetroceso" placeholder="Solo si el porcentaje es menor al actual">
                        <div class="form-text">Si disminuye el avance, el motivo es obligatorio.</div></div>
                </div>
                <div class="card-footer bg-white d-flex gap-2">
                    <button class="btn btn-dracor" type="submit"><i class="bi bi-save"></i> Registrar</button>
                    <a class="btn btn-outline-secondary" th:href="@{/obras/{id}(id=${actividad.obra.id})}">Cancelar</a>
                </div>
            </form>
        </div>
        <div class="col-lg-7"><div class="card"><div class="card-header">Historial de avances</div>
            <table class="table table-sm mb-0"><thead><tr><th>Fecha</th><th>%</th><th>Observación</th><th>Usuario</th></tr></thead><tbody>
                <tr th:each="a : ${avances}">
                    <td th:text="${#temporals.format(a.fecha,'dd/MM/yyyy')}">f</td>
                    <td th:text="${a.porcentaje} + '%'">0</td>
                    <td><span th:text="${a.observacion}"></span><span class="text-danger" th:if="${a.motivoRetroceso}"> · Retroceso: <span th:text="${a.motivoRetroceso}"></span></span></td>
                    <td th:text="${a.usuario != null ? a.usuario.nombreCompleto : '—'}">u</td>
                </tr>
                <tr th:if="${#lists.isEmpty(avances)}"><td colspan="4" class="text-center text-muted py-3">Sin avances registrados.</td></tr>
            </tbody></table></div></div>
    </div>
</section>
</body>
</html>
