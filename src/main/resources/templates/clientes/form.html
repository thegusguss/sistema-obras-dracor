<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, 'clientes', ~{::section})}">
<head><title>Cliente · DRACOR</title></head>
<body>
<section>
    <h1 class="page-title" th:text="${cliente.id == null} ? 'Nuevo cliente' : 'Editar cliente'">Cliente</h1>
    <p class="page-sub">Los campos con * son obligatorios.</p>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <form class="card" th:action="@{/clientes/guardar}" method="post">
        <div class="card-body row g-3">
            <input type="hidden" name="id" th:value="${cliente.id}">
            <div class="col-md-4"><label class="form-label req">Tipo</label>
                <select class="form-select" name="tipo" required>
                    <option th:each="t : ${tipos}" th:value="${t}" th:text="${t.etiqueta}" th:selected="${t == cliente.tipo}">tipo</option>
                </select></div>
            <div class="col-md-4"><label class="form-label req">RUC (11 dígitos)</label><input class="form-control" name="ruc" th:value="${cliente.ruc}" required pattern="[0-9]{11}" maxlength="11"></div>
            <div class="col-md-4"><label class="form-label req">Razón social</label><input class="form-control" name="razonSocial" th:value="${cliente.razonSocial}" required maxlength="160"></div>
            <div class="col-md-12"><label class="form-label">Dirección</label><input class="form-control" name="direccion" th:value="${cliente.direccion}" maxlength="200"></div>
            <div class="col-md-4"><label class="form-label">Persona de contacto</label><input class="form-control" name="personaContacto" th:value="${cliente.personaContacto}" maxlength="120"></div>
            <div class="col-md-4"><label class="form-label">Teléfono</label><input class="form-control" name="telefono" th:value="${cliente.telefono}" maxlength="30"></div>
            <div class="col-md-4"><label class="form-label">Correo</label><input class="form-control" type="email" name="correo" th:value="${cliente.correo}" maxlength="120"></div>
        </div>
        <div class="card-footer bg-white d-flex gap-2">
            <button class="btn btn-dracor" type="submit"><i class="bi bi-save"></i> Guardar</button>
            <a class="btn btn-outline-secondary" th:href="@{/clientes}">Cancelar</a>
        </div>
    </form>
</section>
</body>
</html>
