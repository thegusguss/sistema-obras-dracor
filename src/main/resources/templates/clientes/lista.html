<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, 'clientes', ~{::section})}">
<head><title>Clientes · DRACOR</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div><h1 class="page-title">Clientes y entidades</h1><p class="page-sub mb-0">Entidades públicas y clientes privados.</p></div>
        <a class="btn btn-dracor" th:href="@{/clientes/nuevo}"><i class="bi bi-plus-lg"></i> Nuevo cliente</a>
    </div>
    <form class="row g-2 mb-3" method="get" th:action="@{/clientes}">
        <div class="col-md-5"><input class="form-control" name="q" th:value="${q}" placeholder="Buscar por razón social o RUC"></div>
        <div class="col-auto"><button class="btn btn-navy" type="submit"><i class="bi bi-search"></i> Buscar</button></div>
    </form>
    <div class="card"><div class="table-responsive"><table class="table table-hover mb-0">
        <thead><tr><th>RUC</th><th>Razón social</th><th>Tipo</th><th>Contacto</th><th>Teléfono</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
        <tbody>
        <tr th:each="c : ${clientes}">
            <td th:text="${c.ruc}">ruc</td>
            <td class="fw-semibold" th:text="${c.razonSocial}">rs</td>
            <td th:text="${c.tipo.etiqueta}">tipo</td>
            <td th:text="${c.personaContacto}">contacto</td>
            <td th:text="${c.telefono}">tel</td>
            <td><span class="badge" th:classappend="${c.activo} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${c.activo} ? 'Activo' : 'Inactivo'">Activo</span></td>
            <td class="text-end text-nowrap">
                <a class="btn btn-sm btn-outline-primary" th:href="@{/clientes/{id}/editar(id=${c.id})}"><i class="bi bi-pencil"></i></a>
                <form class="d-inline" th:action="@{/clientes/{id}/estado(id=${c.id})}" method="post">
                    <button class="btn btn-sm btn-outline-secondary" type="submit" th:text="${c.activo} ? 'Desactivar' : 'Activar'">x</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(clientes)}"><td colspan="7" class="text-center text-muted py-4">No hay clientes registrados.</td></tr>
        </tbody></table></div></div>
</section>
</body>
</html>
