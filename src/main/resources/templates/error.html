<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, '', ~{::section})}">
<head><title>Aviso</title></head>
<body>
<section>
    <div class="card mx-auto" style="max-width:640px">
        <div class="card-body text-center py-5">
            <i class="bi bi-exclamation-octagon text-warning" style="font-size:3rem"></i>
            <h4 class="mt-3" th:text="${titulo != null} ? ${titulo} : 'No se pudo mostrar la página'">Aviso</h4>
            <p class="text-muted" th:text="${mensaje != null} ? ${mensaje} : 'La página solicitada no existe o no está disponible.'"></p>
            <p class="small text-muted" th:if="${detalle}" th:text="${detalle}"></p>
            <a class="btn btn-navy" href="javascript:history.back()">Volver</a>
            <a class="btn btn-outline-secondary" th:href="@{/panel}">Ir al panel</a>
        </div>
    </div>
</section>
</body>
</html>
