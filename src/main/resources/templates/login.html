<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingreso · DRACOR</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" th:href="@{/img/logo-dracor.png}">
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <div class="top">
            <img th:src="@{/img/logo-dracor.png}" alt="DRACOR">
            <div class="mt-2 fw-semibold" style="color:#0f2a43">Sistema de Gestión y Seguimiento del Avance de Obras</div>
        </div>
        <div class="body">
            <div class="alert alert-danger py-2" th:if="${param.error}">
                <i class="bi bi-exclamation-triangle me-1"></i>
                <span th:switch="${param.error[0]}">
                    <span th:case="'inactivo'">Su usuario está inactivo. Comuníquese con el administrador.</span>
                    <span th:case="'bloqueado'">Cuenta bloqueada temporalmente por intentos fallidos. Intente más tarde.</span>
                    <span th:case="*">Usuario o contraseña incorrectos.</span>
                </span>
            </div>
            <div class="alert alert-success py-2" th:if="${param.logout}">Sesión cerrada correctamente.</div>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input class="form-control" id="username" name="username" autofocus required autocomplete="username">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password">
                    </div>
                </div>
                <button class="btn btn-dracor w-100 py-2" type="submit"><i class="bi bi-box-arrow-in-right me-1"></i> Ingresar</button>
            </form>
        </div>
        <div class="text-center pb-3 small text-muted">Versión 1.0 · Uso interno</div>
    </div>
</div>
</body>
</html>
