<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, 'usuarios', ~{::section})}">
<head><title>Usuarios · DRACOR</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div><h1 class="page-title">Usuarios y perfiles</h1><p class="page-sub mb-0">Cuentas de acceso y roles del sistema.</p></div>
        <a class="btn btn-dracor" th:href="@{/usuarios/nuevo}"><i class="bi bi-person-plus"></i> Nuevo usuario</a>
    </div>
    <div class="card"><div class="table-responsive"><table class="table table-hover mb-0">
        <thead><tr><th>Usuario</th><th>Nombre</th><th>DNI</th><th>Roles</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
            <td class="fw-semibold" th:text="${u.username}">user</td>
            <td th:text="${u.nombreCompleto}">nombre</td>
            <td th:text="${u.dni}">dni</td>
            <td th:text="${u.rolesTexto}">roles</td>
            <td><span class="badge" th:classappend="${u.activo} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${u.activo} ? 'Activo' : 'Inactivo'">Activo</span></td>
            <td class="text-end text-nowrap">
                <a class="btn btn-sm btn-outline-primary" th:href="@{/usuarios/{id}/editar(id=${u.id})}"><i class="bi bi-pencil"></i></a>
                <form class="d-inline" th:action="@{/usuarios/{id}/estado(id=${u.id})}" method="post">
                    <button class="btn btn-sm btn-outline-secondary" type="submit" th:text="${u.activo} ? 'Desactivar' : 'Activar'">Desactivar</button>
                </form>
            </td>
        </tr>
        </tbody></table></div></div>
</section>
</body>
</html>
